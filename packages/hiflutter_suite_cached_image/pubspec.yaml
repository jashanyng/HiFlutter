name: hiflutter_suite_cached_image
description: >-
  cached_network_image adapter for HiFlutter: provides HiCachedImage and
  HiImageViewer backed by Material 3 components without exposing third-party
  types.
version: 0.0.1
repository: https://github.com/jashanyng/HiFlutter/tree/main/packages/hiflutter_suite_cached_image
issue_tracker: https://github.com/jashanyng/HiFlutter/issues
topics:
  - image
  - cache
  - widgets
  - adapter

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  cached_network_image: ^4.0.7
  flutter:
    sdk: flutter
  hiflutter_base: ^0.0.1
  hiflutter_suite: ^0.0.1
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
